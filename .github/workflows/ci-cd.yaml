name: build-and-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2019_64 
            out: crocodile-windows
            ext: zip
          - os: ubuntu-24.04
            arch: gcc_64
            out: crocodile-ubuntu
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: apt deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev xorg-dev

      - name: setup qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          arch: ${{ matrix.arch }}
          cache: true

      - name: build project
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: run tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Set Version
        shell: bash
        run: |
          OFFSET=48
          PATCH=$(( ${{ github.run_number }} - OFFSET ))
          
          if [ $PATCH -lt 0 ]; then PATCH=0; fi
          
          VERSION="v1.0.${PATCH}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: pack win
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          FOLDER_NAME="${{ matrix.out }}-${{ env.VERSION }}"
          mkdir -p packed/$FOLDER_NAME
          
          cp build/Release/Crocodile.exe packed/$FOLDER_NAME/
          cp build/Release/crocodile_back.dll packed/$FOLDER_NAME/
          
          windeployqt --dir packed/$FOLDER_NAME packed/$FOLDER_NAME/Crocodile.exe
          
          cd packed && 7z a ../$FOLDER_NAME.zip $FOLDER_NAME

      - name: prepare linux asset
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir dist
          cp build/Crocodile dist/
          cp build/logic/crocodile_back.so dist/

      - name: install CqtDeployer
        if: matrix.os == 'ubuntu-24.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo QuasarApp/CQtDeployer --pattern "*.deb"
          sudo apt install -y ./CQtDeployer*.deb

      - name: pack linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          FOLDER_NAME="${{ matrix.out }}-${{ env.VERSION }}"
          cqtdeployer -bin dist/Crocodile -libDir dist -targetDir packed/$FOLDER_NAME
          rm -rf dist
          tar -czf $FOLDER_NAME.tar.gz -C packed $FOLDER_NAME

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}-${{ env.VERSION }}
          path: packed/

      - name: upload to github release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.VERSION }}"
          name: "Release ${{ env.VERSION }}"
          body: |
            Автоматический релиз ${{ env.VERSION }} для коммита ${{ github.sha }}
            Ветка: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: "${{ matrix.out }}-${{ env.VERSION }}.${{ matrix.ext }}"