name: build-and-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2019_64 
            out: crocodile-windows
            ext: zip
          - os: ubuntu-24.04
            arch: gcc_64
            out: crocodile-ubuntu
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: apt deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev xorg-dev

      - name: setup qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          arch: ${{ matrix.arch }}
          cache: true

      - name: build project
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Debug paths for CTest
        shell: bash
        run: |
          echo "=== 1. Текущая папка репозитория ==="
          pwd
          ls -la
          
          echo "=== 2. Структура папки build ==="
          find build -maxdepth 3 -not -path '*/.*'
          
          echo "=== 3. Пробуем найти, где лежит сам исполняемый файл тестов ==="
          find build -type f -executable -name "*test*" -o -name "*Test*" || true

      # - name: run tests
      #   run: |
      #     ctest --test-dir build -C Release --output-on-failure

      - name: pack win
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir dist
          cp build/Release/Crocodile.exe dist/
          cp build/Release/crocodile_back.dll dist/
          windeployqt --dir dist dist/Crocodile.exe
          FOLDER_NAME="${{ matrix.out }}-v0.0.${{ github.run_number }}"
          mkdir -p packed/$FOLDER_NAME/bin
          cp -r dist/* packed/$FOLDER_NAME/bin/
          cp russian.utf-8 packed/$FOLDER_NAME/
          cd packed && 7z a ../$FOLDER_NAME.zip $FOLDER_NAME

      - name: prepare linux asset
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir dist
          cp build/Crocodile dist/
          cp build/crocodile_back.so dist/

      - name: install CqtDeployer
        if: matrix.os == 'ubuntu-24.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo QuasarApp/CQtDeployer --pattern "*.deb"
          sudo apt install -y ./CQtDeployer*.deb

      - name: pack linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cqtdeployer -bin dist/Crocodile -lib dist/crocodile_back.so -targetDir dist_packaged
          rm -rf dist
          FOLDER_NAME="${{ matrix.out }}-v0.0.${{ github.run_number }}"
          mkdir packed
          mv dist_packaged packed/$FOLDER_NAME
          cp russian.utf-8 packed/$FOLDER_NAME/
          tar -czf $FOLDER_NAME.tar.gz -C packed $FOLDER_NAME

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}-v0.0.${{ github.run_number }}
          path: packed/


      - name: upload to github release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v0.0.${{ github.run_number }}"
          name: "Automatic build #${{ github.run_number }}"
          body: |
            Автоматический релиз для коммита ${{ github.sha }}
            Ветка: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: "${{ matrix.out }}-v0.0.${{ github.run_number }}.${{ matrix.ext }}"






